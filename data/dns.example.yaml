enabled: true
default_profile: system
profiles:
  - id: system
    mode: system
    enabled: true
    timeout_ms: 2000
    attempts: 2
    cache_ttl_min_secs: 300
    cache_ttl_max_secs: 86400
    negative_ttl_secs: 30
    stale_fallback_secs: 86400
  - id: cloudflare
    mode: udp
    servers:
      - 1.1.1.1:53
      - 1.0.0.1:53
    enabled: true
    timeout_ms: 2000
    attempts: 2
    cache_ttl_min_secs: 300
    cache_ttl_max_secs: 86400
    negative_ttl_secs: 30
    stale_fallback_secs: 86400
    fallback_profiles:
      - system
routes:
  - id: dns-example-com
    host_pattern: "*.example.com"
    profile_id: cloudflare
    strict: true
    enabled: true
